<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Casa Cinghiala</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans pb-24 select-none">

  <!-- Banner Errore -->
  <div id="error-banner" class="hidden max-w-md mx-auto mb-4 bg-rose-500 text-white p-3 rounded-xl text-xs font-bold text-center shadow-lg"></div>

  <div class="max-w-md mx-auto space-y-6">
    
    <!-- HEADER CON PULSANTE CANCELLO INTELLIGENTE -->
    <header class="text-center py-2 px-2 flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-slate-200/80">
      <div class="text-left">
        <h1 class="text-xl font-black text-slate-800 tracking-tight leading-tight">
          🐗 Casa Cinghiala
        </h1>
        <p class="text-[9px] font-bold text-indigo-600 uppercase tracking-wider">
          Sacro Capriolo Pistolero 🦌
        </p>
      </div>

      <!-- BOTTONE STATO CANCELLO PPP -->
      <button id="gate-toggle-btn" onclick="toggleGate()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold py-2.5 px-3 rounded-xl shadow-md flex items-center gap-1.5 active:scale-95 transition-all">
        <i id="gate-btn-icon" class="fa-solid fa-door-closed text-sm"></i>
        <span id="gate-btn-text">Cancello ...</span>
      </button>
    </header>

    <!-- PAGINA HOME -->
    <main id="page-home" class="space-y-6">
      <!-- CHI C'È A CASA -->
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
            <i class="fa-solid fa-users text-indigo-500"></i> Chi c'è a casa?
          </h2>
          <button onclick="openAvatarModal()" class="text-xs text-indigo-600 font-bold hover:underline bg-indigo-50 px-2 py-1 rounded-lg">
            + Aggiungi
          </button>
        </div>
        <div id="roommates-list" class="flex flex-wrap gap-2 min-h-[40px] items-center">
          <p class="text-xs text-slate-400 italic">Caricamento...</p>
        </div>
      </section>

      <!-- GRIGLIA PULSANTI DINAMICI -->
      <div id="status-grid" class="grid grid-cols-2 gap-3"></div>

      <!-- BOTTONE AGGIUNGI NUOVO TAB -->
      <button onclick="openCustomTabModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center gap-2 transition-all active:scale-95 text-sm">
        <i class="fa-solid fa-plus-circle text-lg"></i> Aggiungi Tab Personalizzato
      </button>
    </main>

    <!-- PAGINA CALENDARIO -->
    <main id="page-calendar" class="space-y-4 hidden">
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-slate-700 text-base flex items-center gap-2">
            <i class="fa-solid fa-calendar-days text-indigo-500"></i> Calendario Casa
          </h2>
          <span id="calendar-month-year" class="text-xs font-bold text-slate-500"></span>
        </div>

        <!-- Griglia Giorni -->
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-400 border-b pb-2">
          <span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span>
        </div>
        <div id="calendar-days-grid" class="grid grid-cols-7 gap-1 text-center"></div>
      </section>

      <!-- Eventi Selezionati del Giorno -->
      <section id="day-details-section" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
        <h3 id="selected-date-title" class="font-bold text-slate-800 text-sm">Seleziona un giorno</h3>
        <div id="day-events-list" class="space-y-2 text-xs">
          <p class="text-slate-400 italic">Nessun evento programmato.</p>
        </div>
        <button onclick="openAddEventModal()" class="w-full bg-indigo-50 text-indigo-600 font-bold py-2 rounded-xl text-xs hover:bg-indigo-100 transition-all">
          + Aggiungi Ospite o Vacanza
        </button>
      </section>
    </main>

  </div>

  <!-- NAVBAR IN BASSO -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center z-40 shadow-lg">
    <button id="nav-home-btn" onclick="switchTab('home')" class="flex flex-col items-center text-indigo-600 font-bold text-xs">
      <i class="fa-solid fa-house text-lg"></i>
      <span>Home</span>
    </button>
    <button id="nav-calendar-btn" onclick="switchTab('calendar')" class="flex flex-col items-center text-slate-400 font-bold text-xs">
      <i class="fa-solid fa-calendar-days text-lg"></i>
      <span>Calendario</span>
    </button>
  </nav>

  <!-- MODALE CREA / MODIFICA TAB -->
  <div id="custom-tab-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 id="modal-tab-title" class="text-lg font-bold text-slate-800">➕ Tab Personalizzato</h2>
        <button onclick="closeCustomTabModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="space-y-3">
        <input type="hidden" id="editing-tab-id">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nome Scheda</label>
          <input type="text" id="tab-name" placeholder="Es. Gatti, Piante, Auto..." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        
        <div id="type-select-container">
          <label class="block text-xs font-bold text-slate-600 mb-1">Tipo di Scheda</label>
          <select id="tab-type" onchange="toggleSubtasksInput()" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="status">Pulsante Stato (Tutto OK / Da Fare / In Corso)</option>
            <option value="list">Lista Cose da Fare (Tipo Spesa)</option>
            <option value="subtasks">Divisione in Sotto-Turni (Tipo Pulizie)</option>
          </select>
        </div>

        <!-- Input Sotto-Turni -->
        <div id="subtasks-input-container" class="hidden">
          <label class="block text-xs font-bold text-slate-600 mb-1">Sotto-Turni (Separati da virgola)</label>
          <input type="text" id="tab-subtasks" placeholder="Es. Cibo, Lettiera, Acqua" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Scegli Icona</label>
          <div id="icon-picker" class="grid grid-cols-5 gap-2 text-xl p-2 border border-slate-200 rounded-xl max-h-40 overflow-y-auto">
            <span onclick="selectIcon(this, 'fa-cat')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-indigo-500"><i class="fa-solid fa-cat"></i></span>
            <span onclick="selectIcon(this, 'fa-dog')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-dog"></i></span>
            <span onclick="selectIcon(this, 'fa-paw')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-paw"></i></span>
            <span onclick="selectIcon(this, 'fa-plant-wilt')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-plant-wilt"></i></span>
            <span onclick="selectIcon(this, 'fa-car')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-car"></i></span>
            <span onclick="selectIcon(this, 'fa-wrench')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-wrench"></i></span>
            <span onclick="selectIcon(this, 'fa-utensils')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-utensils"></i></span>
            <span onclick="selectIcon(this, 'fa-star')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-star"></i></span>
            <span onclick="selectIcon(this, 'fa-gamepad')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-gamepad"></i></span>
            <span onclick="selectIcon(this, 'fa-umbrella-beach')" class="cursor-pointer p-2 text-center rounded-lg hover:bg-slate-100 border-2 border-transparent"><i class="fa-solid fa-umbrella-beach"></i></span>
          </div>
        </div>
        <button onclick="saveCustomTab()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-bold active:bg-emerald-700">Salva Scheda</button>
      </div>
    </div>
  </div>

  <!-- MODALE EVENTO CALENDARIO -->
  <div id="event-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-bold text-slate-800">📅 Aggiungi Evento</h2>
        <button onclick="closeEventModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Tipo Evento</label>
          <select id="event-type" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="ospite">👤 Ospite in Visita</option>
            <option value="vacanza">🏖️ Vacanza / Ferie</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nome / Descrizione</label>
          <input type="text" id="event-title" placeholder="Es. Marco & Sara / Mare a Gallipoli" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Emoji / Avatar</label>
          <input type="text" id="event-emoji" value="👋" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-xl">
        </div>
        <button onclick="saveCalendarEvent()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-bold active:bg-indigo-700">Salva Evento</button>
      </div>
    </div>
  </div>

  <!-- MODALE SOTTO-TURNI DINAMICI -->
  <div id="dynamic-subtasks-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <h2 id="dynamic-subtasks-title" class="text-lg font-bold text-slate-800">🧹 Turni</h2>
          <p class="text-[11px] text-slate-500">Tocca ogni turno per cambiarne lo stato</p>
        </div>
        <button onclick="closeDynamicSubtasksModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div id="dynamic-subtasks-container" class="space-y-2"></div>
    </div>
  </div>

  <!-- MODALE LISTE DINAMICHE -->
  <div id="dynamic-list-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 id="dynamic-list-title" class="text-lg font-bold text-slate-800">📋 Lista</h2>
        <button onclick="closeDynamicListModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="flex gap-2">
        <input type="text" id="dynamic-item-input" placeholder="Aggiungi elemento..." class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addDynamicItem()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold active:bg-indigo-700">Aggiungi</button>
      </div>
      <ul id="dynamic-list-items" class="space-y-2 max-h-60 overflow-y-auto"></ul>
    </div>
  </div>

  <!-- MODALE COINQUILINO -->
  <div id="avatar-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-bold text-slate-800">👤 Aggiungi Coinquilino</h2>
        <button onclick="closeAvatarModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <div class="space-y-3">
        <input type="text" id="roommate-name" placeholder="Nome" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addRoommate()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-bold active:bg-indigo-700">Salva Coinquilino</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDC6wlqz4ARaREum8gXiklq1GvyF1JdpgQ",
      authDomain: "casa-cinghiala.firebaseapp.com",
      projectId: "casa-cinghiala",
      storageBucket: "casa-cinghiala.firebasestorage.app",
      messagingSenderId: "274673117994",
      appId: "1:274673117994:web:a2d31710afdc0c2dd14c53"
    };

    function showError(msg) {
      const banner = document.getElementById('error-banner');
      banner.innerText = msg;
      banner.classList.remove('hidden');
    }

    try { firebase.initializeApp(firebaseConfig); } catch (e) { showError("Errore Init: " + e.message); }
    const db = firebase.firestore();

    const states = [
      { color: 'bg-emerald-500', text: 'Tutto OK' },
      { color: 'bg-rose-500', text: 'Da Fare' },
      { color: 'bg-amber-500', text: 'In Corso' }
    ];

    const defaultTabs = [
      { id: 'spesa', name: 'Spesa', icon: 'fa-cart-shopping', type: 'list' },
      { id: 'monnezza', name: 'Monnezza', icon: 'fa-trash-can', type: 'status' },
      { id: 'orto', name: 'Orto', icon: 'fa-seedling', type: 'status' },
      { id: 'pulizie', name: 'Pulizie', icon: 'fa-broom', type: 'subtasks', subtasks: ['Pavimenti', 'Cucina', 'Bagni', 'Balcone', 'Salone'] }
    ];

    let currentStatusData = {};
    let customTabsList = [];
    let currentActiveListTab = null;
    let currentActiveSubtasksTab = null;
    let selectedDateStr = new Date().toISOString().split('T')[0];

    // 1. GESTIONE INTERRUTTORE CANCELLO PPP
    function toggleGate() {
      const isCurrentlyOpen = currentStatusData.gateOpen || false;
      const newState = !isCurrentlyOpen;
      
      db.collection('casa').doc('stati').update({ gateOpen: newState });
    }

    function updateGateButtonUI(isOpen) {
      const btn = document.getElementById('gate-toggle-btn');
      const icon = document.getElementById('gate-btn-icon');
      const text = document.getElementById('gate-btn-text');

      if (isOpen) {
        btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl shadow-md flex items-center gap-1.5 active:scale-95 transition-all";
        icon.className = "fa-solid fa-door-open text-sm";
        text.innerText = "Aperto 🔓";
      } else {
        btn.className = "bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl shadow-md flex items-center gap-1.5 active:scale-95 transition-all";
        icon.className = "fa-solid fa-door-closed text-sm";
        text.innerText = "Chiuso 🔒";
      }
    }

    // 2. NAVIGAZIONE TAB (Home / Calendario)
    function switchTab(page) {
      if(page === 'home') {
        document.getElementById('page-home').classList.remove('hidden');
        document.getElementById('page-calendar').classList.add('hidden');
        document.getElementById('nav-home-btn').className = "flex flex-col items-center text-indigo-600 font-bold text-xs";
        document.getElementById('nav-calendar-btn').className = "flex flex-col items-center text-slate-400 font-bold text-xs";
      } else {
        document.getElementById('page-home').classList.add('hidden');
        document.getElementById('page-calendar').classList.remove('hidden');
        document.getElementById('nav-home-btn').className = "flex flex-col items-center text-slate-400 font-bold text-xs";
        document.getElementById('nav-calendar-btn').className = "flex flex-col items-center text-indigo-600 font-bold text-xs";
        renderCalendar();
      }
    }

    // 3. ASCOLTO STATI IN TEMPO REALE
    db.collection('casa').doc('stati').onSnapshot(doc => {
      if (doc.exists) {
        currentStatusData = doc.data();
        customTabsList = currentStatusData.customTabs || [];
        
        // Aggiorna Pulsante Cancello
        updateGateButtonUI(currentStatusData.gateOpen || false);

        renderGrid();
        
        // Aggiorna Modale Sotto-turni Live se aperta
        if (currentActiveSubtasksTab) {
          renderSubtasksModal();
        }
      } else {
        db.collection('casa').doc('stati').set({ spesa: 0, monnezza: 0, orto: 0, pulizie: 0, gateOpen: false, customTabs: [] });
      }
    });

    function renderGrid() {
      const grid = document.getElementById('status-grid');
      grid.innerHTML = '';
      const allTabs = [...defaultTabs, ...customTabsList];

      allTabs.forEach(tab => {
        const col = document.createElement('div');
        col.className = 'relative';

        if (tab.type === 'list') {
          const stateIdx = currentStatusData[tab.id] || 0;
          col.innerHTML = `
            <button onclick="changeStatus('${tab.id}')" class="w-full ${states[stateIdx].color} text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center space-y-2 transition-all active:scale-95 pb-10">
              <i class="fa-solid ${tab.icon} text-3xl"></i>
              <span class="font-bold text-base">${tab.name}</span>
              <span class="text-[11px] bg-white/20 px-2 py-0.5 rounded-full font-medium">${states[stateIdx].text}</span>
            </button>
            <button onclick="openDynamicListModal('${tab.id}', '${tab.name}')" class="absolute bottom-2 left-2 right-2 bg-black/20 active:bg-black/40 text-white text-xs font-semibold py-1 rounded-xl backdrop-blur-md transition-all flex items-center justify-center gap-1">
              <i class="fa-solid fa-list-check"></i> Apri Lista
            </button>
            <button onclick="editTab('${tab.id}')" class="absolute top-2 right-2 text-white/70 hover:text-white p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
          `;
        } else if (tab.type === 'subtasks') {
          const subData = currentStatusData[`sub_${tab.id}`] || {};
          const subList = tab.subtasks || [];
          let doneCount = 0;
          subList.forEach((s, idx) => { if ((subData[idx] || 0) === 0) doneCount++; });

          col.innerHTML = `
            <button onclick="openDynamicSubtasksModal('${tab.id}', '${tab.name}')" class="w-full bg-violet-600 text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center space-y-2 transition-all active:scale-95">
              <i class="fa-solid ${tab.icon} text-3xl"></i>
              <span class="font-bold text-base">${tab.name}</span>
              <span class="text-[11px] bg-white/20 px-2 py-0.5 rounded-full font-medium">${doneCount}/${subList.length} Fatti</span>
            </button>
            <button onclick="editTab('${tab.id}')" class="absolute top-2 right-2 text-white/70 hover:text-white p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
          `;
        } else {
          const stateIdx = currentStatusData[tab.id] || 0;
          col.innerHTML = `
            <button onclick="changeStatus('${tab.id}')" class="w-full ${states[stateIdx].color} text-white p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center space-y-2 transition-all active:scale-95">
              <i class="fa-solid ${tab.icon} text-3xl"></i>
              <span class="font-bold text-base">${tab.name}</span>
              <span class="text-[11px] bg-white/20 px-2 py-0.5 rounded-full font-medium">${states[stateIdx].text}</span>
            </button>
            <button onclick="editTab('${tab.id}')" class="absolute top-2 right-2 text-white/70 hover:text-white p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
          `;
        }
        grid.appendChild(col);
      });
    }

    function changeStatus(key) {
      const nextIdx = ((currentStatusData[key] || 0) + 1) % states.length;
      db.collection('casa').doc('stati').update({ [key]: nextIdx });
    }

    // 4. MODIFICA TAB
    let selectedIconClass = 'fa-cat';
    function editTab(tabId) {
      const allTabs = [...defaultTabs, ...customTabsList];
      const tab = allTabs.find(t => t.id === tabId);
      if (!tab) return;

      document.getElementById('modal-tab-title').innerText = "✏️ Modifica Tab";
      document.getElementById('editing-tab-id').value = tab.id;
      document.getElementById('tab-name').value = tab.name;
      document.getElementById('tab-type').value = tab.type;
      document.getElementById('type-select-container').classList.add('hidden');

      if (tab.type === 'subtasks') {
        document.getElementById('subtasks-input-container').classList.remove('hidden');
        document.getElementById('tab-subtasks').value = (tab.subtasks || []).join(', ');
      } else {
        document.getElementById('subtasks-input-container').classList.add('hidden');
      }

      openCustomTabModal();
    }

    function saveCustomTab() {
      const editingId = document.getElementById('editing-tab-id').value;
      const name = document.getElementById('tab-name').value.trim();
      const type = document.getElementById('tab-type').value;
      if (!name) return;

      if (editingId) {
        let allCustoms = [...customTabsList];
        let idx = allCustoms.findIndex(t => t.id === editingId);
        
        let targetTab = idx !== -1 ? allCustoms[idx] : defaultTabs.find(t => t.id === editingId);
        targetTab.name = name;
        targetTab.icon = selectedIconClass;

        if (targetTab.type === 'subtasks') {
          const subInput = document.getElementById('tab-subtasks').value;
          targetTab.subtasks = subInput ? subInput.split(',').map(s => s.trim()).filter(s => s) : [];
        }

        if (idx !== -1) {
          db.collection('casa').doc('stati').update({ customTabs: allCustoms });
        } else {
          db.collection('casa').doc('stati').update({ customTabs: [...customTabsList, targetTab] });
        }
      } else {
        const newId = 'tab_' + Date.now();
        let newTabObj = { id: newId, name: name, icon: selectedIconClass, type: type };
        if (type === 'subtasks') {
          const subInput = document.getElementById('tab-subtasks').value;
          newTabObj.subtasks = subInput ? subInput.split(',').map(s => s.trim()).filter(s => s) : ['Incarico 1'];
        }
        db.collection('casa').doc('stati').update({
          customTabs: [...customTabsList, newTabObj],
          [newId]: 0
        });
      }
      closeCustomTabModal();
    }

    // 5. CALENDARIO
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    function renderCalendar() {
      const daysGrid = document.getElementById('calendar-days-grid');
      daysGrid.innerHTML = '';
      const date = new Date(currentYear, currentMonth, 1);
      
      const monthNames = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
      document.getElementById('calendar-month-year').innerText = `${monthNames[currentMonth]} ${currentYear}`;

      let firstDayIndex = date.getDay() - 1;
      if (firstDayIndex === -1) firstDayIndex = 6;

      const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();

      db.collection('calendario').onSnapshot(snapshot => {
        let events = {};
        snapshot.forEach(doc => { events[doc.id] = doc.data().items || []; });

        daysGrid.innerHTML = '';
        for (let x = 0; x < firstDayIndex; x++) daysGrid.innerHTML += `<div></div>`;

        for (let day = 1; day <= lastDay; day++) {
          const dayStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const dayEvents = events[dayStr] || [];
          const isSelected = dayStr === selectedDateStr;

          const dayEl = document.createElement('div');
          dayEl.className = `p-2 rounded-xl text-xs font-bold flex flex-col items-center justify-between cursor-pointer border ${isSelected ? 'border-indigo-600 bg-indigo-50' : 'border-slate-100 bg-slate-50'}`;
          dayEl.onclick = () => selectCalendarDate(dayStr);
          
          let dots = dayEvents.map(e => e.emoji).join('');
          dayEl.innerHTML = `<span>${day}</span><span class="text-[10px] mt-1">${dots}</span>`;
          daysGrid.appendChild(dayEl);
        }
        loadDayEvents(selectedDateStr, events[selectedDateStr] || []);
      });
    }

    function selectCalendarDate(dateStr) {
      selectedDateStr = dateStr;
      renderCalendar();
    }

    function loadDayEvents(dateStr, dayEvents) {
      document.getElementById('selected-date-title').innerText = `Eventi del ${dateStr}`;
      const list = document.getElementById('day-events-list');
      list.innerHTML = '';

      if (dayEvents.length === 0) {
        list.innerHTML = `<p class="text-slate-400 italic">Nessun evento registrato per questa data.</p>`;
        return;
      }

      dayEvents.forEach((ev, idx) => {
        const item = document.createElement('div');
        item.className = "flex justify-between items-center p-2 rounded-xl bg-slate-50 border border-slate-200";
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-base">${ev.emoji}</span>
            <span class="font-bold text-slate-700">${ev.title}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full ${ev.type === 'vacanza' ? 'bg-amber-100 text-amber-700' : 'bg-indigo-100 text-indigo-700'}">${ev.type}</span>
          </div>
          <button onclick="deleteCalendarEvent('${dateStr}', ${idx})" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
        `;
        list.appendChild(item);
      });
    }

    function saveCalendarEvent() {
      const type = document.getElementById('event-type').value;
      const title = document.getElementById('event-title').value.trim();
      const emoji = document.getElementById('event-emoji').value.trim() || '📅';
      if (!title) return;

      const docRef = db.collection('calendario').doc(selectedDateStr);
      docRef.get().then(doc => {
        let existing = doc.exists ? (doc.data().items || []) : [];
        existing.push({ type, title, emoji });
        docRef.set({ items: existing });
        closeEventModal();
      });
    }

    function deleteCalendarEvent(dateStr, index) {
      const docRef = db.collection('calendario').doc(dateStr);
      docRef.get().then(doc => {
        if (doc.exists) {
          let existing = doc.data().items || [];
          existing.splice(index, 1);
          docRef.set({ items: existing });
        }
      });
    }

    // 6. SOTTO-TURNI
    function openDynamicSubtasksModal(tabId, tabName) {
      currentActiveSubtasksTab = tabId;
      document.getElementById('dynamic-subtasks-title').innerText = "🧹 " + tabName;
      renderSubtasksModal();
      document.getElementById('dynamic-subtasks-modal').classList.replace('hidden', 'flex');
    }

    function renderSubtasksModal() {
      if (!currentActiveSubtasksTab) return;
      const allTabs = [...defaultTabs, ...customTabsList];
      const tab = allTabs.find(t => t.id === currentActiveSubtasksTab);
      if (!tab) return;

      const container = document.getElementById('dynamic-subtasks-container');
      container.innerHTML = '';
      const subData = currentStatusData[`sub_${tab.id}`] || {};
      const subList = tab.subtasks || [];

      subList.forEach((subName, idx) => {
        const stateIdx = subData[idx] || 0;
        const div = document.createElement('div');
        div.className = `flex justify-between items-center ${states[stateIdx].color} text-white p-3 rounded-xl cursor-pointer active:scale-98 transition-all`;
        div.onclick = () => changeSubtaskState(tab.id, idx);
        div.innerHTML = `
          <span class="font-bold text-sm">${subName}</span>
          <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full font-medium">${states[stateIdx].text}</span>
        `;
        container.appendChild(div);
      });
    }

    function changeSubtaskState(tabId, subIdx) {
      const subData = currentStatusData[`sub_${tabId}`] || {};
      const nextIdx = ((subData[subIdx] || 0) + 1) % states.length;
      subData[subIdx] = nextIdx;
      db.collection('casa').doc('stati').update({ [`sub_${tabId}`]: subData });
    }

    function closeDynamicSubtasksModal() {
      document.getElementById('dynamic-subtasks-modal').classList.replace('flex', 'hidden');
      currentActiveSubtasksTab = null;
    }

    // 7. LISTE DINAMICHE
    function openDynamicListModal(tabId, tabName) {
      currentActiveListTab = tabId;
      document.getElementById('dynamic-list-title').innerText = "📋 " + tabName;
      renderListItems();
      document.getElementById('dynamic-list-modal').classList.replace('hidden', 'flex');
    }

    function renderListItems() {
      if (!currentActiveListTab) return;
      const listContainer = document.getElementById('dynamic-list-items');
      listContainer.innerHTML = '';

      db.collection('liste').doc(currentActiveListTab).get().then(doc => {
        const items = doc.exists ? (doc.data().items || []) : [];
        items.forEach((item, index) => {
          const li = document.createElement('li');
          li.className = "flex justify-between items-center bg-slate-100 p-2.5 rounded-xl border border-slate-200 text-sm";
          li.innerHTML = `
            <span class="font-medium text-slate-700">${item}</span>
            <button onclick="removeDynamicItem(${index})" class="text-rose-500 hover:text-rose-700 font-bold p-1"><i class="fa-solid fa-trash"></i></button>
          `;
          listContainer.appendChild(li);
        });
      });
    }

    function addDynamicItem() {
      const input = document.getElementById('dynamic-item-input');
      const val = input.value.trim();
      if (!val || !currentActiveListTab) return;

      const docRef = db.collection('liste').doc(currentActiveListTab);
      docRef.get().then(doc => {
        let existing = doc.exists ? (doc.data().items || []) : [];
        existing.push(val);
        docRef.set({ items: existing }).then(() => {
          input.value = '';
          renderListItems();
        });
      });
    }

    function removeDynamicItem(index) {
      const docRef = db.collection('liste').doc(currentActiveListTab);
      docRef.get().then(doc => {
        if (doc.exists) {
          let existing = doc.data().items || [];
          existing.splice(index, 1);
          docRef.set({ items: existing }).then(() => renderListItems());
        }
      });
    }

    function closeDynamicListModal() {
      document.getElementById('dynamic-list-modal').classList.replace('flex', 'hidden');
      currentActiveListTab = null;
    }

    // COINQUILINI
    db.collection('coinquilini').onSnapshot(snapshot => {
      const roommatesList = document.getElementById('roommates-list');
      roommatesList.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const card = document.createElement('div');
        card.className = `flex items-center gap-1.5 ${data.inHouse ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-100 border-slate-200 opacity-50'} border px-3 py-1.5 rounded-full cursor-pointer`;
        card.innerHTML = `<span class="text-lg">${data.emoji || '🐗'}</span><span class="text-xs font-bold">${data.name}</span>`;
        card.onclick = () => db.collection('coinquilini').doc(doc.id).update({ inHouse: !data.inHouse });
        roommatesList.appendChild(card);
      });
    });

    function addRoommate() {
      const input = document.getElementById('roommate-name');
      if (!input.value.trim()) return;
      db.collection('coinquilini').add({ name: input.value.trim(), emoji: '🐗', inHouse: true });
      input.value = '';
      closeAvatarModal();
    }

    // UTILS MODALI
    function openCustomTabModal() { 
      document.getElementById('editing-tab-id').value = '';
      document.getElementById('modal-tab-title').innerText = "➕ Tab Personalizzato";
      document.getElementById('type-select-container').classList.remove('hidden');
      document.getElementById('custom-tab-modal').classList.replace('hidden', 'flex'); 
    }
    function closeCustomTabModal() { document.getElementById('custom-tab-modal').classList.replace('flex', 'hidden'); }
    function openAvatarModal() { document.getElementById('avatar-modal').classList.replace('hidden', 'flex'); }
    function closeAvatarModal() { document.getElementById('avatar-modal').classList.replace('flex', 'hidden'); }
    function openAddEventModal() { document.getElementById('event-modal').classList.replace('hidden', 'flex'); }
    function closeEventModal() { document.getElementById('event-modal').classList.replace('flex', 'hidden'); }
    function toggleSubtasksInput() {
      const type = document.getElementById('tab-type').value;
      if (type === 'subtasks') document.getElementById('subtasks-input-container').classList.remove('hidden');
      else document.getElementById('subtasks-input-container').classList.add('hidden');
    }
    function selectIcon(el, icon) {
      document.querySelectorAll('#icon-picker span').forEach(s => s.classList.replace('border-indigo-500', 'border-transparent'));
      el.classList.replace('border-transparent', 'border-indigo-500');
      selectedIconClass = icon;
    }
  </script>
</body>
</html>
