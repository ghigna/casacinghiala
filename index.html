<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Cinghiala - Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #1a1a24;
      color: #f3f4f6;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #2d2d3d;
    }

    header h1 {
      font-size: 2.2rem;
      color: #f59e0b;
      margin-bottom: 5px;
    }

    header p {
      color: #9ca3af;
    }

    .section {
      background: #242433;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .section-title {
      font-size: 1.4rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e5e7eb;
    }

    /* --- SEZIONE CANCELLO --- */
    .gate-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a24;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #374151;
    }

    .gate-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .gate-status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .gate-status-badge.open {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .gate-status-badge.closed {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .gate-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .gate-btn.open-action {
      background-color: #22c55e;
      color: #000;
    }

    .gate-btn.open-action:hover {
      background-color: #16a34a;
    }

    .gate-btn.close-action {
      background-color: #ef4444;
      color: #fff;
    }

    .gate-btn.close-action:hover {
      background-color: #dc2626;
    }

    /* --- SEZIONE INQUILINI CON AVATAR --- */
    .tenants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .tenant-card {
      background: #1a1a24;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid #2d2d3d;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .tenant-card:hover {
      transform: translateY(-2px);
      border-color: #f59e0b;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #f59e0b;
      border: 2px solid #4b5563;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
      border: 2px solid #1a1a24;
    }

    .status-dot.online { background-color: #22c55e; }
    .status-dot.offline { background-color: #6b7280; }

    .tenant-info h4 {
      font-size: 1rem;
      color: #f9fafb;
      margin-bottom: 2px;
    }

    .tenant-info p {
      font-size: 0.85rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐗 Casa Cinghiala</h1>
    <p>Pannello di Controllo e Gestione Domotica</p>
  </header>

  <!-- SEZIONE CANCELLO -->
  <div class="section">
    <h2 class="section-title">🚧 Controllo Cancello</h2>
    <div class="gate-card">
      <div class="gate-info">
        <span style="font-size: 2rem;" id="gateEmoji">🔒</span>
        <div>
          <h3>Stato Cancello</h3>
          <span id="gateBadge" class="gate-status-badge closed">Chiuso</span>
        </div>
      </div>
      <button id="gateToggleBtn" class="gate-btn open-action">Apri Cancello</button>
    </div>
  </div>

  <!-- SEZIONE INQUILINI CON AVATAR -->
  <div class="section">
    <h2 class="section-title">👥 Inquilini della Casa</h2>
    <div class="tenants-grid" id="tenantsGrid">
      <!-- Gli inquilini verranno caricati via JavaScript -->
    </div>
  </div>

  <script>
    /* --- GESTIONE CANCELLO (Sincronizzazione localStorage) --- */
    const gateBadge = document.getElementById('gateBadge');
    const gateEmoji = document.getElementById('gateEmoji');
    const gateToggleBtn = document.getElementById('gateToggleBtn');

    function syncGateUI(isOpen) {
      if (isOpen) {
        gateBadge.textContent = 'Aperto';
        gateBadge.className = 'gate-status-badge open';
        gateEmoji.textContent = '🔓';
        gateToggleBtn.textContent = 'Chiudi Cancello';
        gateToggleBtn.className = 'gate-btn close-action';
      } else {
        gateBadge.textContent = 'Chiuso';
        gateBadge.className = 'gate-status-badge closed';
        gateEmoji.textContent = '🔒';
        gateToggleBtn.textContent = 'Apri Cancello';
        gateToggleBtn.className = 'gate-btn open-action';
      }
    }

    function toggleGate() {
      const currentState = localStorage.getItem('cancello_casa_cinghiala');
      const newState = (currentState === 'aperto') ? 'chiuso' : 'aperto';
      
      // Salva lo stato in localStorage (sincronizza con amici.html)
      localStorage.setItem('cancello_casa_cinghiala', newState);
      syncGateUI(newState === 'aperto');
    }

    gateToggleBtn.addEventListener('click', toggleGate);

    // Inizializzazione stato cancello
    const savedStatus = localStorage.getItem('cancello_casa_cinghiala') || 'chiuso';
    syncGateUI(savedStatus === 'aperto');


    /* --- GESTIONE INQUILINI E AVATAR --- */
    const inquilini = [
      {
        nome: "Marco",
        ruolo: "Stanza 1",
        avatar: "https://i.pravatar.cc/150?img=11", // URL immagine avatar
        online: true
      },
      {
        nome: "Giulia",
        ruolo: "Stanza 2",
        avatar: "https://i.pravatar.cc/150?img=5",
        online: true
      },
      {
        nome: "Luca",
        ruolo: "Stanza 3",
        avatar: "https://i.pravatar.cc/150?img=68",
        online: false
      },
      {
        nome: "Elena",
        ruolo: "Stanza 4",
        avatar: "https://i.pravatar.cc/150?img=47",
        online: true
      }
    ];

    function renderInquilini() {
      const grid = document.getElementById('tenantsGrid');
      grid.innerHTML = '';

      inquilini.forEach(inquilino => {
        const card = document.createElement('div');
        card.className = 'tenant-card';

        card.innerHTML = `
          <div class="avatar-wrapper">
            <img class="avatar" src="${inquilino.avatar}" alt="${inquilino.nome}">
            <span class="status-dot ${inquilino.online ? 'online' : 'offline'}"></span>
          </div>
          <div class="tenant-info">
            <h4>${inquilino.nome}</h4>
            <p>${inquilino.ruolo}</p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    renderInquilini();
  </script>
</body>
</html>
